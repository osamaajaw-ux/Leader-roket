<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leader - Rocket Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Navigation Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #121212;
        }
        .header-title {
            background: #4a2e80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #d8b4fe;
        }
        .balance-box {
            display: flex;
            align-items: center;
            background: #1e1e1e;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
        }
        .balance-box span {
            margin-left: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .settings-btn, .status-dot {
            width: 32px;
            height: 32px;
            background: #1e1e1e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2a2a2a;
        }
        .status-dot::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* History Multipliers Bar */
        .history-bar {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            overflow-x: auto;
            white-space: nowrap;
            background: #121212;
        }
        .history-bar::-webkit-scrollbar {
            display: none;
        }
        .history-item {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .c-green { background: #14532d; color: #4ade80; }
        .c-blue { background: #1e3a8a; color: #60a5fa; }
        .c-purple { background: #581c87; color: #c084fc; }
        .c-yellow { background: #713f12; color: #facc15; }
        .c-red { background: #7f1d1d; color: #f87171; }

        /* Game Arena */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);
            padding: 10px;
        }
        .rocket-graphic {
            width: 90px;
            height: 90px;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Timer / Countdown overlay inside arena */
        .timer-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #2a2a2a;
            border-top-color: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            animation: spin 1s linear infinite;
        }

        /* Main Action Button */
        .action-container {
            padding: 0 16px 12px 16px;
        }
        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .btn-bet { background: #2563eb; color: #fff; }
        .btn-bet:active { background: #1d4ed8; }
        .btn-cancel { background: #374151; color: #9ca3af; }
        .btn-cashout { background: #15803d; color: #fff; }

        /* Players List */
        .players-list {
            flex: 1.2;
            background: #18181b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 12px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #202024;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #27272a;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-avatar {
            width: 36px;
            height: 36px;
            background: #2d3748;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #cbd5e1;
        }
        .player-name {
            font-size: 14px;
            font-weight: 600;
        }
        .player-bet-info {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .player-payout {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
        }

        /* Bottom Nav Bar (Telegram Style) */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #0f0f11;
            padding: 10px 0;
            border-top: 1px solid #222;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #71717a;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #c084fc;
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: #18181b;
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }
        .close-modal {
            background: #27272a;
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
        }
        .input-group {
            background: #27272a;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 12px;
            color: #a1a1aa;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            outline: none;
            width: 100%;
        }
        .btn-modal-confirm {
            background: #3b82f6;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="status-dot"></div>
        <div class="header-title">Ebic Gift</div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="balance-box">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#38bdf8"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg>
                <span id="user-balance">100.00</span>
            </div>
            <div class="settings-btn">⚙️</div>
        </div>
    </div>

    <!-- History Bar -->
    <div class="history-bar" id="history-bar">
        <div class="history-item c-green">2.32x</div>
        <div class="history-item c-blue">1.10x</div>
        <div class="history-item c-purple">18.9x</div>
        <div class="history-item c-yellow">3.57x</div>
        <div class="history-item c-green">7.62x</div>
    </div>

    <!-- Game Arena -->
    <div class="game-container" id="game-container">
        <!-- Will be replaced dynamically by JS (Rocket or Timer) -->
        <svg class="rocket-graphic" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5s5 3 5 10.5c0 3-1.5 5-2 6l-3 2-3-2c-.5-1-2-3-2-6 0-7.5 5-10.5 5-10.5z"/></svg>
    </div>

    <!-- Action Button Area -->
    <div class="action-container">
        <button class="btn-main btn-bet" id="main-action-btn" onclick="openBetModal()">Place bet</button>
    </div>

    <!-- Players Live List -->
    <div class="players-list" id="players-list">
        <!-- Dynamic Online Players -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
            Backpack
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Invite
        </div>
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            Leaderboard
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Earn
        </div>
    </div>

    <!-- Bet Modal -->
    <div class="modal-overlay" id="bet-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Place bet</span>
                <button class="close-modal" onclick="closeBetModal()">✕</button>
            </div>
            <div class="input-group">
                <label>TON amount</label>
                <input type="number" id="bet-input" value="10" min="1" max="100">
            </div>
            <button class="btn-modal-confirm" onclick="placeBet()">Place TON Bet</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let balance = 100.00;
        let currentBet = 0;
        let isPlaying = false;
        let hasBetInCurrentRound = false;
        let gameMultiplier = 1.00;
        let gameState = 'waiting'; // waiting, flying, crashed
        let botPlayers = [
            { name: "Arvin", avatar: "A", bet: 2.00, multi: 1.00 },
            { name: "Parsa", avatar: "P", bet: 50.00, multi: 1.00 },
            { name: "Do'stman", avatar: "D", bet: 10.00, multi: 1.00 },
            { name: "- Leader", avatar: "L", bet: 20.00, multi: 1.00 }
        ];

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
        }

        function openBetModal() {
            if (gameState !== 'waiting') return;
            document.getElementById('bet-modal').style.display = 'flex';
        }

        function closeBetModal() {
            document.getElementById('bet-modal').style.display = 'none';
        }

        function placeBet() {
            let amount = parseFloat(document.getElementById('bet-input').value);
            if (isNaN(amount) || amount <= 0 || amount > balance) {
                alert('رصيدك غير كافي!');
                return;
            }
            balance -= amount;
            currentBet = amount;
            hasBetInCurrentRound = true;
            updateUI();
            closeBetModal();

            // Add Leader to players list
            botPlayers.push({ name: "- Leader", avatar: "L", bet: currentBet, multi: 1.00, isUser: true });
            renderPlayers();

            // Change button to Cancel Bet
            let btn = document.getElementById('main-action-btn');
            btn.innerText = "Cancel Bet";
            btn.className = "btn-main btn-cancel";
            btn.onclick = cancelBet;
        }

        function cancelBet() {
            if (gameState !== 'waiting') return;
            balance += currentBet;
            currentBet = 0;
            hasBetInCurrentRound = false;
            updateUI();
            botPlayers = botPlayers.filter(p => !p.isUser);
            renderPlayers();

            let btn = document.getElementById('main-action-btn');
            btn.innerText = "Place bet";
            btn.className = "btn-main btn-bet";
            btn.onclick = openBetModal;
        }

        function cashOut() {
            if (!isPlaying || !hasBetInCurrentRound) return;
            let winnings = currentBet * gameMultiplier;
            balance += winnings;
            updateUI();
            hasBetInCurrentRound = false;
            isPlaying = false;

            let btn = document.getElementById('main-action-btn');
            btn.innerText = `Cashed Out (${winnings.toFixed(2)} TON)`;
            btn.className = "btn-main btn-bet";
            btn.disabled = true;
        }

        function renderPlayers() {
            let list = document.getElementById('players-list');
            list.innerHTML = '';
            botPlayers.forEach(p => {
                let row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
                    <div class="player-info">
                        <div class="player-avatar">${p.avatar}</div>
                        <div>
                            <div class="player-name">${p.name}</div>
                            <div class="player-bet-info">💎 ${p.bet.toFixed(2)} ${p.multi > 1 ? 'x' + p.multi.toFixed(2) : ''}</div>
                        </div>
                    </div>
                    <div class="player-payout">💎 ${(p.bet * (p.multi > 1 ? p.multi : 1)).toFixed(2)}</div>
                `;
                list.appendChild(row);
            });
        }

        // Global Online Game Simulation Loop (Synchronized for all players)
        function startGameLoop() {
            // Waiting Phase (5 seconds)
            gameState = 'waiting';
            gameMultiplier = 1.00;
            let countdown = 5;
            
            let container = document.getElementById('game-container');
            
            let timerInterval = setInterval(() => {
                container.innerHTML = `<div class="timer-circle">${countdown}</div>`;
                countdown--;
                if (countdown < 0) {
                    clearInterval(timerInterval);
                    startFlyingPhase();
                }
            }, 1000);
        }

        function startFlyingPhase() {
            gameState = 'flying';
            isPlaying = hasBetInCurrentRound;
            let container = document.getElementById('game-container');
            
            if (hasBetInCurrentRound) {
                let btn = document.getElementById('main-action-btn');
                btn.innerText = "Cash Out";
                btn.className = "btn-main btn-cashout";
                btn.disabled = false;
                btn.onclick = cashOut;
            }

            // Random crash point (balanced between 1.2x and 15x)
            let crashPoint = parseFloat((Math.random() * 12 + 1.2).toFixed(2));
            
            let flyInterval = setInterval(() => {
                gameMultiplier += 0.04 + (gameMultiplier * 0.03);
                if (gameMultiplier >= crashPoint) {
                    gameMultiplier = crashPoint;
                    clearInterval(flyInterval);
                    startCrashPhase();
                }

                container.innerHTML = `
                    <div style="font-size: 36px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);">
                        ${gameMultiplier.toFixed(2)}x
                    </div>
                    <svg class="rocket-graphic" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5s5 3 5 10.5c0 3-1.5 5-2 6l-3 2-3-2c-.5-1-2-3-2-6 0-7.5 5-10.5 5-10.5z"/></svg>
                `;

                // Update bots multipliers randomly
                botPlayers.forEach(p => {
                    if (p.multi < crashPoint && Math.random() > 0.3) {
                        p.multi = parseFloat((gameMultiplier * (0.8 + Math.random() * 0.2)).toFixed(2));
                        if (p.multi > crashPoint) p.multi = crashPoint;
                    }
                });
                renderPlayers();

            }, 100);
        }

        function startCrashPhase() {
            gameState = 'crashed';
            let container = document.getElementById('game-container');
            container.innerHTML = `
                <div style="font-size: 28px; font-weight: bold; color: #f87171;">
                    Crashed @ ${gameMultiplier.toFixed(2)}x
                </div>
            `;

            // Add to history bar
            let historyBar = document.getElementById('history-bar');
            let item = document.createElement('div');
            item.className = `history-item ${gameMultiplier > 3 ? 'c-purple' : 'c-green'}`;
            item.innerText = `${gameMultiplier.toFixed(2)}x`;
            historyBar.prepend(item);

            if (hasBetInCurrentRound && isPlaying) {
                hasBetInCurrentRound = false;
                let btn = document.getElementById('main-action-btn');
                btn.innerText = "Place bet";
                btn.className = "btn-main btn-bet";
                btn.disabled = false;
                btn.onclick = openBetModal;
            }

            // Reset user and bots for next round after 3 seconds
            setTimeout(() => {
                botPlayers = [
                    { name: "Arvin", avatar: "A", bet: (Math.random() * 10 + 1).toFixed(2) * 1, multi: 1.00 },
                    { name: "Parsa", avatar: "P", bet: (Math.random() * 30 + 10).toFixed(2) * 1, multi: 1.00 },
                    { name: "Do'stman", avatar: "D", bet: (Math.random() * 15 + 5).toFixed(2) * 1, multi: 1.00 }
                ];
                if (currentBet > 0) {
                    botPlayers.push({ name: "- Leader", avatar: "L", bet: currentBet, multi: 1.00, isUser: true });
                }
                renderPlayers();
                startGameLoop();
            }, 3000);
        }

        // Initialize App
        updateUI();
        renderPlayers();
        startGameLoop();
    </script>
</body>
</html>
